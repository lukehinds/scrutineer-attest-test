name: sign-skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    name: sign
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for Sigstore keyless signing via GitHub OIDC
      contents: write  # required to commit .bundle sidecars back to main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: main

      - uses: always-further/agent-sign@v1 # zizmor: ignore[unpinned-uses]
        with:
          paths: |
            skills/**/SKILL.md
            skills/**/schema.json

      - name: commit bundles
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'skills/**/*.bundle'
          git diff --cached --quiet || git commit -m "chore: sign skill bundles [skip ci]"
          git push
